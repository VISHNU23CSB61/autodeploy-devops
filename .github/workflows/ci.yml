name: AutoDeploy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Node.js application
        run: |
          cd app
          npm test

      - name: Build Docker image
        run: docker build -t autodeploy-app .

      - name: Validate Docker Compose
        run: docker compose config