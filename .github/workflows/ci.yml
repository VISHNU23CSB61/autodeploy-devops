name: AutoDeploy CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Test application
      - name: Test Node.js application
        run: |
          cd app
          npm ci
          npm test

      # Step 4: Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Build Docker image
      - name: Build Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t "ghcr.io/$OWNER/autodeploy-app:latest" .

      # Step 6: Push Docker image
      - name: Push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push "ghcr.io/$OWNER/autodeploy-app:latest"

      # Step 7: Validate Docker Compose
      - name: Validate Docker Compose
        run: docker compose config

      # Step 8: Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # Step 9: Deploy application to EC2 through SSM
      - name: Deploy to EC2 using AWS Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-01ece0df068b8ea40 \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AutoDeploy application" \
            --parameters 'commands=[
              "sudo docker pull ghcr.io/vishnu23csb61/autodeploy-app:latest",
              "sudo docker rm -f autodeploy-app || true",
              "sudo docker run -d --name autodeploy-app --restart unless-stopped -p 80:3000 ghcr.io/vishnu23csb61/autodeploy-app:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-01ece0df068b8ea40

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-01ece0df068b8ea40 \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
