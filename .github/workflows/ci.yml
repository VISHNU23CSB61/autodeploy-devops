name: AutoDeploy CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: [self-hosted, Windows, X64, autodeploy]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Node.js application
        run: |
          cd app
          npm test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        shell: powershell
        run: |
          $OWNER = "${{ github.repository_owner }}".ToLower()
          docker build -t "ghcr.io/$OWNER/autodeploy-app:latest" .

      - name: Push Docker image
        shell: powershell
        run: |
          $OWNER = "${{ github.repository_owner }}".ToLower()
          docker push "ghcr.io/$OWNER/autodeploy-app:latest"

      - name: Validate Docker Compose
        run: docker compose config