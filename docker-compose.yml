services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodeploy-app
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: autodeploy-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app